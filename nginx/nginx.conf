user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/log/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
                    
    access_log /var/log/nginx/access.log main;
    
    sendfile on;
    keepalive_timeout 65;

    # Allow admin GLB model uploads (default 1m would 413 a ~9MB model)
    client_max_body_size 50M;
    
    # Rate Limiting definitions (REQ-NFR-004)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=15r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    
    server {
        listen 80;
        listen 443 ssl;
        server_name localhost;
        
        # Self-signed certificate paths (generated during build)
        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        
        # Redirect HTTP to HTTPS (REQ-NFR-003)
        if ($scheme = http) {
            return 301 https://$host$request_uri;
        }

        # Frontend SPA
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth Endpoints Rate Limiting (REQ-NFR-004)
        location /api/v1/auth {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Regular API Endpoints Rate Limiting (REQ-NFR-004)
        location /api/v1 {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
